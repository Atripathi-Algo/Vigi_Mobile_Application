h1{font-size:22px;line-height:1.2;margin:0;font-weight:600;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;max-width:80ch}
.bar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center}

.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
.canvas{background:var(--panel);border:1px solid var(--line);overflow-x:auto}
svg{display:block;width:100%;min-width:1000px;height:auto}
.side{background:var(--panel);border:1px solid var(--line);padding:16px;position:sticky;top:12px;min-width:0}
.side h2{font-size:17px;margin:0 0 2px;font-weight:600}
.side .path{font:400 12px var(--mono);color:var(--muted);overflow-wrap:anywhere}

.side h3{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.links{display:flex;flex-direction:column;gap:4px;padding:0;margin:0;list-style:none}

.links .dir{font:500 11px var(--mono);color:var(--muted);flex:none;width:30px}

.flowbox{background:var(--panel);border:1px solid var(--line);padding:12px 16px}
.flowbox ol{margin:6px 0 0;padding-left:22px}
.flowbox li{margin:3px 0}
.hint{color:var(--muted);font-size:12.5px}
/* svg */
.gbox{fill:none;stroke-width:1.6}
.gtitle{font:600 12.5px var(--sans);fill:var(--ink)}
.gnote{font:400 11px var(--mono);fill:var(--muted)}
.node{cursor:pointer;transition:opacity .15s}
.node .name{font:600 12.5px var(--sans);fill:var(--ink)}
.node .sub{font:400 10.5px var(--mono);fill:var(--muted);margin:0}
.node .glyph{font:600 15px var(--mono);fill:#fff}
.node .ring{fill:none;stroke:var(--focus);stroke-width:3;opacity:0}
.node.sel .ring{opacity:1}
.node:hover .tile{stroke:var(--ink);stroke-width:1.5}
.edge path{fill:none;stroke:var(--ink);stroke-width:1.5;opacity:.8}
.edge.planned path{stroke-dasharray:5 4;stroke:var(--planned)}
.edge .elbl{font:500 11px var(--mono);fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:5px;stroke-linejoin:round}
.edge.planned .elbl{fill:var(--muted)}
.edge{cursor:pointer;transition:opacity .15s}
.edge.hot path{stroke:var(--focus);stroke-width:2.6;opacity:1}
.edge.hot .elbl{fill:var(--focus)}
.edge .hit{stroke:transparent;stroke-width:14;fill:none}
.step{fill:var(--focus)} .stepn{font:600 11px var(--mono);fill:#fff;text-anchor:middle}
.dim{opacity:.16}
.arrow{fill:var(--ink)}
@media (max-width:980px){.main{grid-template-columns:minmax(0,1fr)}.side{position:static}}
@media (prefers-reduced-motion:reduce){.node,.edge{transition:none}}

  s:['The briefing screen asks the store for objectives, ledger and sleep.','Engines rank the primary objectives and compute the ops window.','The weather client calls Open-Meteo using the URL and coordinates in .env.','A failed or blank call swaps the CONDITIONS tile for SLEEP.']},
 remind:{t:'Reminders, steps and widgets',e:['eng','brg'],n:['engines','plat','steps','notif','widgets','alarm'],
  s:['After every change the store debounces 1.5 s, then re-arms reminders and pushes widget data.','Notifications schedules due-in-30, next-op, streak, wind-down and briefing alerts on the seven channels.','Widgets receive the next op, three objectives, steps and water. Tapping one runs a background callback that writes the store.','The step sensor reports a count since boot; the store turns it into today\'s steps and refreshes the widgets.']},
 push:{t:'Firebase push',e:['psh'],n:['fcm','push','notif'],
  s:['FCM delivers a message to the device token shown in Loadout.','The push service receives it while the app is open and shows it on the matching channel.','With the app closed, notification messages are shown by Android; data-only messages run a background handler that does the same.','All of this stays off until the FIREBASE_* keys are set in .env.']},
 build:{t:'Build to APK',e:['p1','p2','p3','p4'],n:['src','fb','grad','apk','repo'],
  s:['flutter analyze and compile the Dart code.','Gradle assembles the release variant with the SDK in D:\\Android\\Sdk.','One APK per CPU is packaged and signed with the debug key.','Source is committed and pushed to GitHub; APKs stay out of git (copied to release/).']}
};

var $=function(i){return document.getElementById(i)};
var NS='http://www.w3.org/2000/svg';
function el(n,a,p){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
var nodeEls={},edgeEls={},groupEls={};
var sel=null,flow=null,hidden={};

G.forEach(function(g){
  var o=el('g',{},$('groups')); groupEls[g.id]=o;
  var col='var('+g.c+')';
  var r=el('rect',{x:g.x,y:g.y,width:g.w,height:g.h,'class':'gbox',stroke:col,fill:'none'},o);
  if(g.dash)r.setAttribute('stroke-dasharray',g.dash);
  el('rect',{x:g.x,y:g.y,width:22,height:22,fill:col},o);
  var t=el('text',{x:g.x+30,y:g.y+16,'class':'gtitle'},o);t.textContent=g.t;
  var tw=g.t.length*7+40;
  var n=el('text',{x:g.x+tw,y:g.y+16,'class':'gnote'},o);n.textContent=g.n;
});

E.forEach(function(e){
  var o=el('g',{'class':'edge'+(e.planned?' planned':''),tabindex:0,role:'button','aria-label':'Connection: '+e.t},$('edges'));
  e.pts.forEach(function(poly){
    var d='M'+poly.map(function(p){return p[0]+' '+p[1]}).join(' L');
    var attrs={d:d,'marker-end':'url(#ah)'};if(e.both)attrs['marker-start']='url(#ah)';el('path',attrs,o);
    el('path',{d:d,'class':'hit'},o);
  });
  var l=el('text',{x:e.lx,y:e.ly,'class':'elbl','text-anchor':e.anc||'middle'},o);l.textContent=e.t;
  o.addEventListener('click',function(ev){ev.stopPropagation();selectEdge(e.id)});
  o.addEventListener('keydown',function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();selectEdge(e.id)}});
  edgeEls[e.id]=o;
});

N.forEach(function(n){
  var o=el('g',{'class':'node',tabindex:0,role:'button','aria-label':n.l+', '+ST[n.st]},$('nodes'));
  var x=n.x-28,y=n.y-28;
  el('rect',{x:x-5,y:y-5,width:66,height:66,'class':'ring'},o);
  var t=el('rect',{x:x,y:y,width:56,height:56,fill:CAT[n.c],'class':'tile',rx:3},o);
  if(n.st==='planned'){t.setAttribute('opacity','.5');t.setAttribute('stroke','var(--planned)');t.setAttribute('stroke-dasharray','4 3');t.setAttribute('stroke-width','1.5')}
  var g=el('text',{x:n.x,y:n.y+5,'class':'glyph','text-anchor':'middle'},o);g.textContent=n.g;
  var sc=n.st==='built'?'var(--built)':n.st==='partial'?'var(--partial)':'var(--panel)';
  var b=el('circle',{cx:x+56,cy:y,r:7,fill:sc,stroke:n.st==='planned'?'var(--planned)':'var(--panel)','stroke-width':n.st==='planned'?2:2},o);
  var nm=el('text',{x:n.x,y:n.y+44,'class':'name','text-anchor':'middle'},o);nm.textContent=n.l;
  var sb=el('text',{x:n.x,y:n.y+58,'class':'sub','text-anchor':'middle'},o);sb.textContent=n.s;
  o.addEventListener('click',function(ev){ev.stopPropagation();selectNode(n.id)});
  o.addEventListener('keydown',function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();selectNode(n.id)}});
  nodeEls[n.id]=o;
});
$('dia').addEventListener('click',function(){sel=null;paint();renderSide()});

function nodeById(i){return N.filter(function(n){return n.id===i})[0]}
function edgeById(i){return E.filter(function(e){return e.id===i})[0]}
function groupHas(gid,nid){
  if(gid==='plat')return ['hc','usage','alarm','notif','bio','voice'].indexOf(nid)>-1;
  return false;
}

function selectNode(i){flow=null;sel={k:'n',id:i};paint();renderSide()}
function selectEdge(i){flow=null;sel={k:'e',id:i};paint();renderSide()}

function paint(){
  var hotN={},hotE={},active=false;
  if(flow){active=true;FLOWS[flow].n.forEach(function(i){hotN[i]=1});FLOWS[flow].e.forEach(function(i){hotE[i]=1})}
  else if(sel){
    active=true;
    if(sel.k==='n'){hotN[sel.id]=1;E.forEach(function(e){if(e.a===sel.id||e.b===sel.id){hotE[e.id]=1;hotN[e.a]=1;hotN[e.b]=1}})}
    else{var e0=edgeById(sel.id);hotE[e0.id]=1;hotN[e0.a]=1;hotN[e0.b]=1}
  }
  N.forEach(function(n){
    var o=nodeEls[n.id];
    var isHot=!active||hotN[n.id]||(active&&n.c==='plat'&&hotN.plat);
    var hide=hidden[n.st];
    o.classList.toggle('dim',!isHot||hide);
    o.classList.toggle('sel',!!sel&&sel.k==='n'&&sel.id===n.id);
  });
  E.forEach(function(e){
    var o=edgeEls[e.id];
    var an=nodeById(e.a),bn=nodeById(e.b);
    var hide=(hidden[an.st]&&hidden[bn.st]);
    o.classList.toggle('hot',!!hotE[e.id]);
    o.classList.toggle('dim',(active&&!hotE[e.id])||hide);
  });
  Object.keys(groupEls).forEach(function(k){
    var g=groupEls[k];
    var keep=!active;
    if(active){
      if(k==='plat')keep=!!(flow&&FLOWS[flow].n.indexOf('plat')>-1)||(sel&&sel.k==='e'&&edgeById(sel.id).b==='plat')||(sel&&sel.k==='n'&&groupHas('plat',sel.id));
      else keep=true;
    }
    g.classList.toggle('dim',!keep&&k==='plat');
  });
  // step badges in a flow
  var old=document.querySelectorAll('.stepbadge');for(var i=0;i<old.length;i++)old[i].remove();
  if(flow){FLOWS[flow].e.forEach(function(id,idx){
    var e=edgeById(id),p=e.pts[0],mid=p[Math.floor(p.length/2)];
    var a=p[Math.max(0,Math.floor(p.length/2)-1)];
    var cx=(mid[0]+a[0])/2,cy=(mid[1]+a[1])/2;
    if(p.length===2){cx=(p[0][0]+p[1][0])/2;cy=(p[0][1]+p[1][1])/2}
    var g=el('g',{'class':'stepbadge'},$('edges'));
    el('circle',{cx:cx,cy:cy+ (p.length===2&&p[0][1]===p[1][1]?10:0),r:9,'class':'step'},g);
    var t=el('text',{x:cx,y:cy+(p.length===2&&p[0][1]===p[1][1]?14:4),'class':'stepn'},g);t.textContent=idx+1;
  })}
}

function renderSide(){
  var s=$('side');
  if(!sel){
    s.innerHTML='<h2>How to read this</h2><p class="hint">Tiles are components, coloured by layer. The dot on a tile shows status. Solid arrows exist in the code; dashed grey arrows are planned. Select a tile or arrow for its file, role and neighbours.</p>'+
    '<h3>Layers</h3><ul class="steps" style="list-style:none;padding:0">'+
    [['ui','Presentation'],['state','State and engines'],['store','Storage and config'],['integ','Integration'],['plat','Platform bridges'],['ext','Outside the phone'],['build','Build']].map(function(x){return '<li><svg width="12" height="12" style="min-width:0;display:inline;vertical-align:-1px;margin-right:8px"><rect width="12" height="12" fill="'+CAT[x[0]]+'"/></svg>'+x[1]+'</li>'}).join('')+'</ul>'+
    '<h3>Rules the code follows</h3><ol class="steps"><li>Every number on screen comes from the store, never from the model.</li><li>Every outbound call is optional and returns null on failure.</li><li>Keys and URLs live in <code>.env</code>, nowhere else.</li></ol>';
    return;
  }
  var h='';
  function links(id){
    var out=E.filter(function(e){return e.a===id||e.b===id}).map(function(e){
      var other=nodeById(e.a===id?e.b:e.a);
      return '<li><button data-n="'+other.id+'"><span class="dir">'+(e.a===id?'to':'from')+'</span><span>'+other.l+' · '+e.t+'</span></button></li>';
    }).join('');
    return out?'<h3>Talks to</h3><ul class="links">'+out+'</ul>':'';
  }
  if(sel.k==='n'){
    var n=nodeById(sel.id);
    h='<h2>'+n.l+'</h2><div class="path">'+n.p+'</div><div class="pill"><span class="dot '+n.st+'"></span>'+ST[n.st]+'</div><p>'+n.d+'</p>'+links(n.id);
  }else{
    var e=edgeById(sel.id),a=nodeById(e.a),b=nodeById(e.b);
    h='<h2>'+e.t+'</h2><div class="path">'+a.l+' → '+b.l+'</div><div class="pill"><span class="dot '+(e.planned?'planned':'built')+'"></span>'+(e.planned?'Not built yet':'Built in this repo')+'</div>'+
      '<h3>Endpoints</h3><ul class="links"><li><button data-n="'+a.id+'"><span class="dir">from</span><span>'+a.l+'</span></button></li><li><button data-n="'+b.id+'"><span class="dir">to</span><span>'+b.l+'</span></button></li></ul>';
  }
  s.innerHTML=h;
}
$('side').addEventListener('click',function(ev){
  var b=ev.target.closest('button[data-n]');if(b)selectNode(b.getAttribute('data-n'));
});

function renderFlow(){
  var fb=$('flowbox');
  if(!flow){fb.hidden=true;return}
  var f=FLOWS[flow];
  fb.hidden=false;
  fb.innerHTML='<strong>'+f.t+'</strong><ol>'+f.s.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ol>';
}
document.querySelectorAll('[data-flow]').forEach(function(b){
  b.addEventListener('click',function(){
    var k=b.getAttribute('data-flow');
    flow=(flow===k)?null:k;sel=null;
    document.querySelectorAll('[data-flow]').forEach(function(x){x.setAttribute('aria-pressed',String(x.getAttribute('data-flow')===flow))});
    paint();renderFlow();renderSide();
  });
});
document.querySelectorAll('[data-st]').forEach(function(b){
  b.addEventListener('click',function(){
    var k=b.getAttribute('data-st');hidden[k]=!hidden[k];
    b.setAttribute('aria-pressed',String(!hidden[k]));paint();
  });
});
paint();renderSide();
})();
</script>
