name: vigil
description: VIGIL - personal daily ops companion (Flutter, dark only, on-device first).
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  flutter_dotenv: ^5.2.1
  http: ^1.2.2
  intl: ^0.20.2
  shared_preferences: ^2.3.4
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  pedometer: ^4.2.0
  permission_handler: 12.0.1
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  home_widget: ^0.10.0
  flutter_secure_storage: ^11.2.0
  health: ^13.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/svg/
    - assets/svg/icons/
    - google_fonts/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon/ios/AppIcon-1024.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#0A0B0D"
  adaptive_icon_foreground: "assets/app_icon/android/ic_launcher_foreground.png"
  adaptive_icon_monochrome: "assets/app_icon/android/ic_launcher_monochrome.png"
